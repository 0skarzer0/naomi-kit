name: checks
on: [push, pull_request]
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python scripts compile
        run: python3 -m py_compile tools/nk_pack.py tools/pi/*.py
      - name: Shell scripts parse
        run: for f in tools/pi/*.sh; do bash -n "$f"; done
      - name: nk_pack on a fake NAOMI image
        run: |
          python3 - <<'PY'
          import struct
          img = bytearray(0x1000); img[:5] = b"NAOMI"
          struct.pack_into("<III", img, 0x360, 0x400, 0x8c020000, 0x200)
          open("/tmp/in.bin", "wb").write(img)
          PY
          mkdir /tmp/d && echo hi > /tmp/d/a.txt
          python3 tools/nk_pack.py /tmp/in.bin /tmp/d /tmp/out.bin
          test -s /tmp/out.bin
